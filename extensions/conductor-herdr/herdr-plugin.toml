id = "conductor.herdr"
name = "Conductor Herdr"
version = "0.4.0"
min_herdr_version = "0.7.3"
description = "Native Conductor lifecycle events and workspace-scoped state"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/conductor-herdr.mjs", "event"]

[[events]]
on = "pane.exited"
command = ["node", "bin/conductor-herdr.mjs", "event"]
